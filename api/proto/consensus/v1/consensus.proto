syntax = "proto3";

package consensus.v1;

option go_package = "ClusterManager/api/gen/consensus/v1;consensusv1";

service ConsensusCoordinationService {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendRequest) returns (AppendResponse);
  rpc ClientAppend(RawAppendRequest) returns (AppendResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message VoteRequest {
  string origin_node_id = 1;
  int32 type = 2; // 1 = Actual vote, 2 = Tentative
  int64 term = 3;
  int64 log_term = 4;
  int64 log_index = 5;
}

message VoteResponse {
  string response_node_id = 1;
  bool vote = 2;
}

message AppendRequest {
  string origin_node_id = 1;
  string request_id = 2;
  int64 term = 3;
  int64 index = 4;
  int64 prev_log_term = 5;
  int64 prev_log_index = 6;
  string scheduler_id = 7;
  bytes payload = 8;
}

message AppendResponse {
  string request_id = 1;
  int32 status = 2; // 1 = Success, 2 = Bad Payload or OriginID, 3 = Needs Snapshot Install / Failed to get consensus
  int64 prev_log_term = 3;
  int64 prev_log_index = 4;
  string leader_address = 5;
}

message RawAppendRequest {
  string origin_node_id = 1;
  string request_id = 2;
  string scheduler_id = 3;
  bytes payload = 4;
}

message InstallSnapshotRequest {
  string leader_id = 1;
  int64 term = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  int64 term = 1;
}
